name: goalnow_app
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State manager
  provider: ^6.1.5+1

  # http
  http: ^1.6.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # WebSocket
  web_socket_channel: ^3.0.3

  # JSON Annototation for serialization
  json_annotation: ^4.8.1

  # Webview
  webview_flutter: ^4.13.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.1.0

  # Flutter SVG
  flutter_svg: ^2.2.1

  # Flutter Launcher Icons
  flutter_launcher_icons: ^0.13.1

  # Connectivity
  connectivity_plus: ^7.0.0

  # Image Picker
  flutter_slidable: ^4.0.3

  # Video Player
  video_player: ^2.10.1

  # Icons
  cupertino_icons: ^1.0.8

  # Calendar integration
  add_2_calendar: ^3.0.1

  # Internationalization and localization
  intl: ^0.19.0

  # YouTube Player
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/img_logo.jpg"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: "assets/images/img_logo.jpg"


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/video/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

